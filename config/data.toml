# Phase 2: Character tokenizer + WikiText subset for quick iteration
# Using 500K tokens (~25% of 2MB subset) for fast training tests
dataset_path = "data/fast/wikitext_100k_tokens__utf8.npy"
tokenizer_name = "char"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 256  # Ignored for utf8 mode (fixed to 256)
tokenizer_backend = "gpt2_bpe"  # Not used for char tokenizer
unigram_model_path = ""
max_length = 128  # Reduced for Phase 2 MVP
num_workers = 6
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false  # Using simple file loading for Phase 2
cache_dir = "./data/cache"
num_shards = 64
validation_split = 0.1  # 10% for validation
seed = 42
