# Curriculum learning config — alternates between TinyStories and WikiText
# Parameters tuned for real learning without overfitting:
# - Larger model (256 dim, 6 layers) handles more data without overfit
# - Longer training schedule (5000 steps) for convergence
# - Moderate validation split (10%) to catch overfitting
# - Dropout (0.1) for regularization
# - Uses tokenized full datasets (~2M tokens each)

[experiment]
name = "maxllm-curriculum-stories-wikitext"
output_dir = "./outputs/curriculum-alternating"

[model]
hidden_size = 256
num_layers = 6
num_heads = 8
vocab_size = 256
max_seq_length = 512
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 1024      # 4 × hidden_size
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 256
dropout = 0.1                  # Regularization to prevent overfitting

[training]
batch_size = 8
gradient_accumulation_steps = 1
max_steps = 5000
warmup_steps = 200
learning_rate = 0.0005         # Lower for larger model
weight_decay = 0.01
betas = [0.9, 0.95]
epsilon = 1e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 250
eval_interval = 200
log_interval = 50
keep_last_n_checkpoints = 5
use_torch_compile = false
use_flash_attention = false
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 64
temperature = 0.8
top_p = 0.9
top_k = 50
use_kv_cache = false
kv_cache_dtype = "bf16"

# Curriculum: Start with TinyStories (simpler text),
# then alternate with WikiText (more diverse).
# Training loop will swap dataset_path at checkpoints.
[data]
dataset_path = "data/fast/tinystories_5m_tokens__utf8.npy"
tokenizer_name = "char"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 256
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256               # Increase from 128 for better learning
num_workers = 2
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1         # 10% validation to monitor overfitting
seed = 42
