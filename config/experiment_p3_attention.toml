# Phase 3 — AttentionLM test (single attention layer, no FFN)
# Quick validation of CausalMultiHeadAttention in training context.

[experiment]
name = "maxllm-p3-attention-test"
output_dir = "./outputs/p3-attention-test"

[model]
model_type = "attention_lm"
hidden_size = 128
num_layers = 1            # AttentionLM is single-layer by design
num_heads = 4
# gpt2 = 50 257 tokens; rounded up to next multiple of 64 for alignment
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64       # placeholder — Phase 8
rope_base = 10000         # placeholder — Phase 5
intermediate_size = 512   # 4 × hidden_size (unused in AttentionLM)
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128     # placeholder — Phase 8
dropout = 0.1

[training]
batch_size = 4
gradient_accumulation_steps = 1
max_steps = 500
warmup_steps = 10
learning_rate = 0.001
weight_decay = 0.0
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 100
eval_interval = 100
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
use_flash_attention = false
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/wikitext_bpe_gpt2_500k_tokens.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"           # ignored by BPETokenizer; kept for config compat
tokenizer_vocab_size = 50304      # informational; BPETokenizer reads vocab from tiktoken
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 0
prefetch_factor = 2
pin_memory = false
persistent_workers = false
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
