# Phase 3 exploration — BPE tokenizer (gpt2, 50 257-token vocab) + SimpleLM
# Uses pre-tokenized .npy cache for instant startup (created by pre-tokenization step).

[experiment]
name = "maxllm-p3-bpe-explore"
output_dir = "./outputs/p3-bpe-explore"

[model]
model_type = "simple_lm"
hidden_size = 128
num_layers = 1
num_heads = 4
# gpt2 = 50 257 tokens; rounded up to next multiple of 64 for alignment
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64       # placeholder — Phase 6
rope_base = 10000         # placeholder — Phase 5
intermediate_size = 512   # 4 × hidden_size
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128     # placeholder — Phase 7
dropout = 0.0

[training]
batch_size = 4
gradient_accumulation_steps = 1
max_steps = 500
warmup_steps = 10
learning_rate = 0.001
weight_decay = 0.0
betas = [0.9, 0.95]
epsilon = 1e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 100
eval_interval = 50
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "standard"
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 32
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/wikitext_bpe_gpt2_500k_tokens.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"           # ignored by BPETokenizer; kept for config compat
tokenizer_vocab_size = 50304      # informational; BPETokenizer reads vocab from tiktoken
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 128
num_workers = 0
prefetch_factor = 2
pin_memory = false
persistent_workers = false
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
