[experiment]
name = "p3_wikitext_tinystories_70_30_10m_bpe_scaled"
output_dir = "outputs/p3-wikitext-tinystories-70-30-10m-bpe-scaled"

[model]
model_type = "attention_lm"
hidden_size = 1024
num_layers = 4
num_heads = 8
max_seq_length = 256
vocab_size = 50304
mla_latent_dim = 128
rope_base = 10000
intermediate_size = 4096
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 1024
dropout = 0.1

[training]
batch_size = 48
gradient_accumulation_steps = 4
max_steps = 10000
warmup_steps = 500
learning_rate = 0.0005
weight_decay = 0.01
betas = [0.9, 0.95]
epsilon = 1e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 500
eval_interval = 500
log_interval = 100
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "standard"
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 100
temperature = 0.8
top_p = 0.9
top_k = 40
use_kv_cache = true
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/wikitext_tinystories_70_30_10m_train_tokens__bpe.npy"
validation_dataset_path = "data/fast/wikitext_tinystories_70_30_10m_val_tokens__bpe.npy"
test_dataset_path = "data/fast/wikitext_tinystories_70_30_10m_test_tokens__bpe.npy"
tokenizer_name = "bpe"
tokenizer_backend = "gpt2_bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = false
streaming = false
cache_dir = ".cache"
num_shards = 1
validation_split = 0.01
seed = 42
