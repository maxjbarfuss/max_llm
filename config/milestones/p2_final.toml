# Phase 2 final best-in-class experiment (SimpleLM + UTF-8)
# Canonical Phase 2 capabilities with explicit train/val/test and reproducible settings.

[experiment]
name = "maxllm-p2-final"
output_dir = "./outputs/p2-final"

[model]
model_type = "simple_lm"
hidden_size = 128
num_layers = 1
num_heads = 4
vocab_size = 256
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 512
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.0

[training]
batch_size = 8
gradient_accumulation_steps = 1
max_steps = 5000
warmup_steps = 200
learning_rate = 0.0005
weight_decay = 0.0
betas = [0.9, 0.95]
epsilon = 1e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 500
eval_interval = 250
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "standard"
selective_checkpointing = false
early_stopping_patience = 12
early_stopping_min_delta = 0.0005
label_smoothing = 0.0
eval_on_test = true

[inference]
device = "auto"
max_new_tokens = 80
temperature = 0.9
top_p = 0.9
top_k = 20
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/combined_wikitext_tinystories_10m_tokens_utf8_train.npy"
validation_dataset_path = "data/fast/combined_wikitext_tinystories_10m_tokens_utf8_val.npy"
test_dataset_path = "data/fast/combined_wikitext_tinystories_10m_tokens_utf8_test.npy"
tokenizer_name = "char"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 256
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 128
num_workers = 0
prefetch_factor = 2
pin_memory = false
persistent_workers = false
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
