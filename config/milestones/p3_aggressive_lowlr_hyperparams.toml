# Phase 3 — Aggressive hyperparameter tuning: Lower LR + Higher warmup
# Problem: 50M dataset diverged (loss 7.0 vs baseline 4.31)
# Hypothesis: Previous learning rate (0.0003) too aggressive for larger data
# Solution: 10x lower LR (0.0001) + 5x longer warmup (1000 steps) + stable batch
# Expected: Should converge smoothly, similar to or better than baseline

[experiment]
name = "p3-aggressive-lowlr-hyperparams"
output_dir = "./outputs/p3-aggressive-lowlr-hyperparams"

[model]
model_type = "decoder_lm"
hidden_size = 256
num_layers = 4
num_heads = 4
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 1024
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[data]
dataset_path = "data/fast/interleaved_mixed_50m_tokens_bpe_gpt2_v2.npy"
# Dataset composition (VERIFIED):
#   - wikitext_10m: 10M tokens (20%)
#   - tinystories_5m: 5M tokens (10%)
#   - webtext_15m: 15M tokens (30%)
#   + repeat: wiki 8M, stories 4M, webtext 8M
#   = 50M total, all three sources represented
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42

[training]
# AGGRESSIVE HYPERPARAMS (Option A)
batch_size = 8
gradient_accumulation_steps = 4        # ↑ 4 (was 2) → stable effective batch=32
max_steps = 10000
warmup_steps = 1000                    # ↑ 1000 (was 200) → 5x longer warmup
learning_rate = 0.0001                 # ↓ 0.0001 (was 0.0003) → 10x lower
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 500
eval_interval = 200
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "flash"
selective_checkpointing = false

# Early stopping to prevent wasteful training on plateau
early_stopping_patience = 5
early_stopping_min_delta = 0.01
eval_on_test = true

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[logging]
log_level = "INFO"
log_format = "default"
