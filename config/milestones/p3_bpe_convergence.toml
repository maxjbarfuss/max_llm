# Phase 3 — sealed best-of-breed baseline (decoder + BPE + full optimization stack)
#
# This configuration reproduces the locked checkpoint from outputs/p3-bpe-convergence/
# Final metrics: loss=4.31, perplexity=74.5, steps=5000
#
# Key optimizations:
# - Flash Attention 2 (3-4x speedup over standard attention)
# - BF16 mixed precision (prevents NaN/Inf divergence, 1.5-2x throughput)
# - Cosine + warmup scheduler (smooths convergence curve)
# - Gradient accumulation (effective batch=16 with 2 micro-batches)
# - Selective weight decay (excludes bias/LayerNorm parameters)
# - Gradient clipping (clip_norm=1.0 essential with BF16)

[experiment]
name = "maxllm-p3-bpe-convergence"
output_dir = "./outputs/p3-bpe-convergence"

[model]
model_type = "decoder_lm"
hidden_size = 256
num_layers = 4
num_heads = 4
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 1024
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[training]
batch_size = 8
gradient_accumulation_steps = 2  # Effective batch size: 16
max_steps = 5000
warmup_steps = 200  # Linear warmup for 200 steps at start of training
learning_rate = 0.0003
weight_decay = 0.01  # Selective: excludes bias and LayerNorm params
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0  # Prevents gradient explosion with BF16
precision_schedule = [[0, -1, "bf16"]]  # BF16 from step 0 to end
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 500
eval_interval = 100  # Evaluate every 100 steps to track convergence
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false  # Keep false when using Flash Attention
attention_backend = "flash"  # Use Flash Attention 2 for 3-4x speedup
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/interleaved_wikitext_tinystories_10m_tokens_bpe_gpt2.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
# Data loading optimizations
num_workers = 4         # 4 parallel workers for data loading
prefetch_factor = 2     # Prefetch 2 batches ahead of main thread
pin_memory = true       # Pin memory pages for fast GPU transfer
persistent_workers = true  # Keep workers alive between iterations
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1  # 10% validation split (creates train/val dynamically from single file)
seed = 42
