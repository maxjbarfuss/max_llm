# Phase 3 — Convergence milestone: interleaved TinyStories+WikiText BPE
#
# Purpose: Committed proof that DecoderLM converges on the canonical interleaved
# TinyStories+WikiText BPE dataset. Uses the pre-split 2.15M train / 0.38M val
# subset (70% WikiText + 30% TinyStories, BPE/gpt2 tokenisation, seq_len=256).
#
# This run was modeled after the successful ephemeral convergence run
# (5000 steps, ppl ~65–83 confirmed). The committed version is the milestone
# artifact that demonstrates Phase 3 training stability on the interleaved corpus.
#
# Train tokens : 2,146,538  (~8,367 samples at seq_len=256)
# Val tokens   : 375,246   (~1,460 samples)
# Steps        : 5000 ≈ 9.6 epochs at effective_batch_size=16 (batch=8, accum=2)
# Expected     : loss ≈ 4.0–4.5, ppl ≈ 55–90

[experiment]
name = "maxllm-p3-bpe-convergence"
output_dir = "./outputs/p3-bpe-convergence"

[model]
model_type = "decoder_lm"
hidden_size = 256
num_layers = 4
num_heads = 4
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 1024
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[training]
batch_size = 8
gradient_accumulation_steps = 2
max_steps = 5000
warmup_steps = 200
learning_rate = 0.0003
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 1000
eval_interval = 500
log_interval = 100
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "flash"
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/wikitext_tinystories_70_30_10m_train_tokens__bpe.npy"
validation_dataset_path = "data/fast/wikitext_tinystories_70_30_10m_val_tokens__bpe.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
