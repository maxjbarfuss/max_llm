# Phase 3 — Convergence proof run on 10M interleaved TinyStories+WikiText BPE tokens
#
# Purpose: Demonstrate that DecoderLM converges on the canonical Phase 3 dataset.
# This is the committed milestone artifact that proves Phase 3 training stability.
#
# Dataset: interleaved_wikitext_tinystories_10m_tokens_bpe_gpt2.npy (10M BPE tokens)
# Effective training tokens: ~9M (90% split), ~35K samples at seq_len=256
# Steps: 5000 ≈ 2.3 epochs at effective_batch_size=16 (batch=8, accum=2)
#
# Expected result: loss ≈ 4.0–4.5, ppl ≈ 55–90 (converged from ~10.8 initial)

[experiment]
name = "maxllm-p3-interleaved-10m-convergence"
output_dir = "./outputs/p3-interleaved-10m-convergence"

[model]
model_type = "decoder_lm"
hidden_size = 256
num_layers = 4
num_heads = 4
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 1024
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[training]
batch_size = 8
gradient_accumulation_steps = 2
max_steps = 5000
warmup_steps = 300
learning_rate = 0.0003
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 1000
eval_interval = 500
log_interval = 100
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "flash"
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/interleaved_wikitext_tinystories_10m_tokens_bpe_gpt2.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
