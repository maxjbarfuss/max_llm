# Phase 3 — optimized variant: Larger model (512H x 8L) on 50M data
# Tests: Combined scaling experiment—does bigger model + more data compound?
# Expected: Best loss (~3.5-4.0), but 20-30x GPU hours. Use for long runs.

[experiment]
name = "p3-optimized-512h-50m"
output_dir = "./outputs/p3-optimized-512h-50m"

[model]
model_type = "decoder_lm"
hidden_size = 512
num_layers = 8
num_heads = 8
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 2048
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[training]
batch_size = 8
gradient_accumulation_steps = 4    # ↑ Larger effective batch for stability with bigger model
max_steps = 20000                  # ↑ Longer training on 5x data
warmup_steps = 500                 # ↑ Longer warmup for larger model
learning_rate = 0.0003
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 1000
eval_interval = 500
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "flash"
selective_checkpointing = false

# Early stopping: stop if val loss plateaus for 5 evals
early_stopping_patience = 5
early_stopping_min_delta = 0.01
eval_on_test = true

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/interleaved_wikitext_tinystories_50m_pages_bpe_gpt2.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
