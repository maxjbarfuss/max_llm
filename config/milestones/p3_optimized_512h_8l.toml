# Phase 3 — optimized variant: Larger architecture (512H x 8L) on baseline data
# Tests: Is current model capacity-limited? Does 512H+8L converge faster?
# Expected: If this beats baseline significantly, we were capacity-limited

[experiment]
name = "p3-optimized-512h-8l"
output_dir = "./outputs/p3-optimized-512h-8l"

[model]
model_type = "decoder_lm"
hidden_size = 512        # ↑ Doubled from 256 (4.3x param increase)
num_layers = 8           # ↑ Doubled from 4 (more depth)
num_heads = 8            # Adjusted to divide 512 evenly
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 2048  # Scales with hidden_size
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[training]
batch_size = 8
gradient_accumulation_steps = 4  # ↑ Larger batch for stability (eff=32 vs 16)
max_steps = 5000
warmup_steps = 1000  # ↑ Longer warmup: 200→1000 for 110M param model (critical!)
learning_rate = 0.0001  # ↓ Reduced from 0.0003 (10x lower for larger model)
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 500
eval_interval = 100
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "flash"
selective_checkpointing = false

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/interleaved_wikitext_tinystories_10m_tokens_bpe_gpt2.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
seed = 42
