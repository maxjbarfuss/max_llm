# Phase 3 — optimized variant: Even larger architecture (768H x 8L) on baseline data + DDP
# Tests: Does larger hidden size help convergence? Can we saturate 2x RTX 4090/3090 GPU capacity?
# Expected: 768H should converge faster than 512H; target loss < 3.9

[experiment]
name = "p3-optimized-768h-8l"
output_dir = "./outputs/p3-optimized-768h-8l"

[model]
model_type = "decoder_lm"
hidden_size = 768        # ↑ 768 (from 512) — ~200M total params
num_layers = 8           # Keep depth, scale width
num_heads = 8            # Keep same head count, larger per-head dimension (768/8=96)
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64      # Keep same latent dim
rope_base = 10000
intermediate_size = 3072  # Scales with hidden_size (4× rule)
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.1

[training]
batch_size = 8           # per GPU
gradient_accumulation_steps = 4  # eff batch = 8 * 2 GPUs * 4 accumulation = 64
max_steps = 5000
warmup_steps = 1200      # ↑ Slightly longer warmup for 200M model
learning_rate = 0.00008  # ↓ Slightly lower LR (0.0001 for 110M, 0.00008 for 200M)
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 500
eval_interval = 100
log_interval = 50
keep_last_n_checkpoints = 3
use_torch_compile = false
attention_backend = "flash"
selective_checkpointing = true  # Enable to manage 200M param memory

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/interleaved_wikitext_tinystories_10m_tokens_bpe_gpt2.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
