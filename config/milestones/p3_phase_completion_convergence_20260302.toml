# Phase 3 Completion Milestone: Full Optimization Convergence Validation
# Purpose: Validate DecoderLM + BPE + all Phase 3 optimizations on combined corpus
# Date: 2026-03-02
# Strategy: Decoder architecture with Flash attention, torch.compile, label smoothing, early stopping
# Expected outcome: Stable convergence curve, no validation divergence, measure actual convergence speed with full tech stack

[experiment]
name = "p3-phase-completion-convergence"
output_dir = "./outputs/milestones/p3-convergence-20260302"
description = "Phase 3 completion: DecoderLM 4L/256H with full optimization stack (torch.compile, Flash attention, BF16 AMP, label smoothing, early stopping)"

[model]
model_type = "decoder_lm"
hidden_size = 256
num_layers = 4
num_heads = 4
vocab_size = 50304
max_seq_length = 256
mla_latent_dim = 64
rope_base = 10000
intermediate_size = 1024
num_experts = 1
experts_per_token = 1
moe_frequency = 0
gru_hidden_size = 128
dropout = 0.15

[training]
batch_size = 8
gradient_accumulation_steps = 4
max_steps = 50000
warmup_steps = 500
learning_rate = 0.0003
weight_decay = 0.15
betas = [0.9, 0.999]
epsilon = 1.0e-8
gradient_clip_norm = 1.0
precision_schedule = [[0, -1, "bf16"]]
moe_balance_loss_weight = 0.0
distributed_backend = "ddp"
checkpoint_interval = 2000
eval_interval = 500
log_interval = 50
keep_last_n_checkpoints = 5

# Phase 3 OPTIMIZATION TECH STACK
use_torch_compile = true          # ✅ AOT compilation to CUDA (10-20% speedup)
attention_backend = "flash"       # ✅ Flash Attention 2
selective_checkpointing = false

# Convergence & Generalization
early_stopping_patience = 5       # Stop after 5 evals (2500 steps) without 0.01 improvement
early_stopping_min_delta = 0.01
label_smoothing = 0.1             # Regularize against overconfident predictions
eval_on_test = true

[inference]
device = "auto"
max_new_tokens = 64
temperature = 1.0
top_p = 0.9
top_k = 0
use_kv_cache = false
kv_cache_dtype = "bf16"

[data]
dataset_path = "data/fast/interleaved_wikitext_tinystories_10m_tokens_bpe_gpt2.npy"
tokenizer_name = "bpe"
tokenizer_mode = "utf8"
tokenizer_vocab_size = 50304
tokenizer_backend = "gpt2_bpe"
unigram_model_path = ""
max_length = 256
num_workers = 4
prefetch_factor = 2
pin_memory = true
persistent_workers = true
streaming = false
cache_dir = "./data/cache"
num_shards = 1
validation_split = 0.1
