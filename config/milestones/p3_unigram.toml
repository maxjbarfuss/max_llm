# Phase 3 Unigram — Coherence Run with SentencePiece Unigram 8K
#
# Goal: Validate that the Unigram tokenizer escapes the plateau seen with custom BPE 8K.
#
# Architecture: identical to p3_baseline (8-layer decoder, 768d, 12h, ~62M params)
#
# Tokenizer: SentencePiece Unigram 8192 vocab
#   Trained on the same mixed corpus (TinyStories + FineWeb-Edu + WikiText-103)
#   File: data/fast/mixed_10t_60f_30w_unigram8k_tokenizer.model
#
# Data: mixed_10t_60f_30w_unigram8k (~21.5B tokens total)
#   Mix: 10% TinyStories / 60% FineWeb-Edu / 30% WikiText-103
#   NOTE: This dataset was built WITHOUT EOS tokens between documents.
#         Rebuild with updated prepare_dataset.py (eos_token_id=1) for a proper run.
#
# Training: initial validation run (3000 steps ≈ 786M tokens ≈ 3.6% of train data)
#   If no plateau (unlike BPE), extend max_steps or re-run with full passes.
#
# Prepare tokenizer + data (if rebuilding with EOS):
#   source .venv/bin/activate
#   python scripts/data/prepare_dataset.py --config <your_mix_config.json>
#   (set "eos_token_id": 1 in output section of the JSON config)
#
# Train (2 GPUs):
#   source .venv/bin/activate
#   torchrun --nproc_per_node=2 -m src.training.train \
#     --config config/milestones/p3_unigram.toml --distributed

[experiment]
name       = "p3-unigram"
output_dir = "./outputs/p3-unigram"

[model]
model_type        = "decoder_lm"
hidden_size       = 768
num_layers        = 8
num_heads         = 12
vocab_size        = 8192
max_seq_length    = 1024
intermediate_size = 3072         # 4 × 768
mla_latent_dim    = 96
rope_base         = 10000
num_experts       = 1
experts_per_token = 1
moe_frequency     = 0
gru_hidden_size   = 768
dropout           = 0.0
share_layer_weights = false

[data]
dataset_path            = "data/fast/mixed_10t_60f_30w_unigram8k_train.npy"
validation_dataset_path = "data/fast/mixed_10t_60f_30w_unigram8k_val.npy"
test_dataset_path       = ""
tokenizer_name          = "unigram"
tokenizer_mode          = "utf8"          # unused for unigram; required by DataConfig
tokenizer_vocab_size    = 8192
tokenizer_backend       = "unigram"
max_length              = 1024
num_workers             = 4
prefetch_factor         = 2
pin_memory              = true
persistent_workers      = false
streaming               = false
seed                    = 42
unigram_model_path      = "data/fast/mixed_10t_60f_30w_unigram8k_tokenizer.model"
cache_dir               = "./data/cache"
num_shards              = 1
validation_split        = 0.0             # explicit val path above

[training]
# 2-GPU DDP: 32/GPU × 2 GPUs × accum=4 × seq=1024 = 262,144 tokens/step
batch_size                  = 32
gradient_accumulation_steps = 4
max_steps                   = 3000
warmup_steps                = 150
learning_rate               = 6e-4
weight_decay                = 0.1
betas                       = [0.9, 0.95]
epsilon                     = 1e-8
gradient_clip_norm          = 1.0
precision_schedule          = [[0, -1, "bf16"]]
moe_balance_loss_weight     = 0.0
distributed_backend         = "ddp"
checkpoint_interval         = 200
eval_interval               = 100
log_interval                = 20
keep_last_n_checkpoints     = 3
use_torch_compile           = false
attention_backend           = "flash"
selective_checkpointing     = true
early_stopping_patience     = 15         # more patience than BPE run; watch for later plateau
early_stopping_min_delta    = 0.001
label_smoothing             = 0.1
eval_on_test                = false
eval_max_batches            = 64         # 64 × 32 × 1024 ≈ 2M tokens per eval

[inference]
device         = "auto"
max_new_tokens = 256
temperature    = 0.8
top_p          = 0.9
top_k          = 40
use_kv_cache   = false
kv_cache_dtype = "bf16"
