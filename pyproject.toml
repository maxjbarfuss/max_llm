[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "max_llm"
version = "0.1.0"
description = "Hybrid LLM with MLA-Transformer-MoE-RNN"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "xformers>=0.0.22",
    "deepspeed>=0.11.0",
    "bitsandbytes>=0.41.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tensorboard>=2.14.0",
    "tensorboard-plugin-profile>=2.14.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.14.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
cuda121 = ["torch>=2.3.0"]
cpu = ["torch>=2.1.0"]
dev = [
    "uv>=0.1.0",
    "black[jupyter]>=23.12.0",
    "ruff>=0.1.11",
    "isort>=5.13.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.5.0",
    "pre-commit>=3.5.0",
]
training = ["wandb>=0.16.0", "huggingface-hub>=0.19.0", "fire>=0.5.0"]
docs = ["sphinx>=7.0.0", "sphinx-rtd-theme>=2.0.0", "mkdocs>=1.5.0"]

[project.urls]
Repository = "https://github.com/yourusername/max_llm"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", ".venv_wsl", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501", "W505"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*", ".venv/*", ".venv_wsl/*"]
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py"]
