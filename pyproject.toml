[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "max_llm"
version = "0.1.0"
description = "Hybrid LLM with MLA-Transformer-MoE-RNN"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
# Minimal base: config/core utilities only. Model and training deps are optional.
dependencies = [
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Python runtime/development stack is managed in requirements.txt via setup.sh.
# Keep only docs extras here for packaging convenience.
docs = ["sphinx>=7.0.0", "sphinx-rtd-theme>=2.0.0", "mkdocs>=1.5.0"]

[project.urls]
Repository = "https://github.com/maxjbarfuss/max_llm"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", ".venv_wsl", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501", "W505"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*", ".venv/*", ".venv_wsl/*"]
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn.*", "xformers.*", "sageattention", "sageattention.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "import-outside-toplevel",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "y", "z"]
