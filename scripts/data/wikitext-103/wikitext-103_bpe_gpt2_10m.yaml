paths:
  source: /mnt/d/dev/data/wikitext-103-raw/train.txt
  output_dir: data/fast
  subset_tokens_path: data/fast/wikitext_10m_tokens_bpe_gpt2.npy
  metadata_path: data/fast/wikitext_10m_tokens_bpe_gpt2.meta.json

storage:
  fast_output_dir: data/fast
  slow_cache_dir: /mnt/d/dev/data/wikitext-103-raw/max_llm_cache

workflow:
  normalize: true
  tokenize: true
  force: false
  normalized_cache_policy: cache
  token_cache_policy: cache
  cleanup_intermediate: true

cutoff:
  mode: none

subset:
  size: 10M

tokenizer:
  name: bpe
  encoding: gpt2
  vocab_size: 50257  # Informational; tiktoken determines actual size

