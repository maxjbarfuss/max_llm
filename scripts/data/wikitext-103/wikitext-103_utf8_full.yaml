paths:
  source: /mnt/d/dev/data/wikitext-103-raw/train.txt
  output_dir: data/fast
  subset_tokens_path: data/fast/wikitext_5m_tokens__utf8.npy
  metadata_path: data/fast/wikitext_5m_tokens__utf8.meta.json

storage:
  fast_output_dir: data/fast
  slow_cache_dir: /mnt/d/dev/data/wikitext-103-raw/max_llm_cache

workflow:
